spring:
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20
  application:
    name: crudEstudo
  mvc:
    servlet:
      path: /v1
  datasource:
    url: jdbc:mysql://localhost:3306/estudandoCRUD?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8089

