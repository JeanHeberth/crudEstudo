spring:
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20
  application:
    name: crudEstudo
  datasource:
    url: jdbc:mysql://localhost:3306/estudandoCRUD?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8089

api:
  version-prefix: ${API_VERSION_PREFIX:/v1}
  endpoints:
    usuario: ${api.version-prefix}/usuario

management:
  endpoints:
    web:
      base-path: ${api.version-prefix}/actuator
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: ${api.version-prefix}/swagger-ui.html
  api-docs:
    path: ${api.version-prefix}/api-docs
