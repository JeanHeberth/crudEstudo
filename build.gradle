plugins {
    id 'java'
    id 'jacoco'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.br'
version = '0.0.1-SNAPSHOT'
description = 'crudEstudo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

war {
    enabled = false
}

bootWar {
    enabled = true
    archiveFileName = "${project.name}.war"
}

tasks.named('test') {
    useJUnitPlatform()
}

// Adicione id 'jacoco' ao bloco plugins {} e acrescente o trecho abaixo ao final do build.gradle.
// 0.00: fração (ex.: 0.70) = cobertura de linhas medida menos ~5 pontos.

jacoco {
    toolVersion = '0.8.13'
}

// Cada job de teste do CI gera o seu test.exec. O gate de qualidade baixa todos em
// build/jacoco-merged/ e calcula a cobertura combinada.
def jacocoMergedData = fileTree(layout.buildDirectory.dir('jacoco-merged')) {
    include '**/*.exec'
}

tasks.register('jacocoMergedReport', JacocoReport) {
    description = 'Relatório de cobertura combinando os .exec de build/jacoco-merged'
    group = 'verification'
    executionData.from(jacocoMergedData)
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoMergedVerification', JacocoCoverageVerification) {
    description = 'Falha se a cobertura combinada ficar abaixo do mínimo'
    group = 'verification'
    executionData.from(jacocoMergedData)
    sourceSets sourceSets.main
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.64
            }
        }
    }
}
